name: Daily rotator cuff outlier scan

on:
  schedule:
    # One run a day at 07:00 UTC.
    # That is 2:00 AM Eastern in winter (EST) and 3:00 AM in summer (EDT).
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the scan
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          python scripts/scan_channels.py 2>&1 | tee scan_output.log

          # Parse NEW_OUTLIERS=number from script output
          parsed=$(grep -Eo 'NEW_OUTLIERS=[0-9]+' scan_output.log | tail -n1 | cut -d= -f2 || true)
          if [ -z "$parsed" ]; then
            parsed="unknown"
          fi
          echo "NEW_OUTLIERS=$parsed" >> "$GITHUB_ENV"

      - name: Commit updated data
        run: |
          git config user.name "pt-outlier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/outliers.json data/channels_seen.json
          git diff --staged --quiet || git commit -m "Daily outlier scan: $(date -u +%Y-%m-%d)"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Send completion email (success or failure)
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          BRANCH: ${{ github.ref_name }}
          JOB_STATUS: ${{ job.status }}
          NEW_OUTLIERS: ${{ env.NEW_OUTLIERS }}
        run: |
          python - << 'PY'
          import os, smtplib
          from email.mime.text import MIMEText

          status = os.environ.get("JOB_STATUS", "unknown").lower()
          new_outliers = os.environ.get("NEW_OUTLIERS", "unknown")

          if status == "success":
              subject = f"✅ daily-scan succeeded | new outliers: {new_outliers}"
          elif status == "failure":
              subject = f"❌ daily-scan failed | new outliers: {new_outliers}"
          else:
              subject = f"ℹ️ daily-scan status: {status} | new outliers: {new_outliers}"

          body = f"""Repository: {os.environ['REPOSITORY']}
          Workflow: {os.environ['WORKFLOW']}
          Job: {os.environ['JOB']}
          Branch: {os.environ['BRANCH']}
          Status: {status.upper()}
          New outliers found: {new_outliers}
          Run URL: {os.environ['RUN_URL']}
          """

          msg = MIMEText(body)
          msg["Subject"] = subject
          msg["From"] = os.environ["ALERT_EMAIL_FROM"]
          msg["To"] = os.environ["ALERT_EMAIL_TO"]

          host = os.environ["SMTP_HOST"]
          port = int(os.environ.get("SMTP_PORT", "587"))
          user = os.environ["SMTP_USERNAME"]
          pwd = os.environ["SMTP_PASSWORD"]

          with smtplib.SMTP(host, port, timeout=30) as s:
              s.starttls()
              s.login(user, pwd)
              s.send_message(msg)

          print("Email sent.")
          PY
