name: Daily rotator cuff outlier scan

on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Skip run unless it is 6am Eastern
        run: |
          hour_et=$(TZ="America/New_York" date +%H)
          if [ "$hour_et" != "06" ]; then
            echo "Current hour in America/New_York is $hour_et, not 06. Skipping this trigger."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != 'true'

      - uses: actions/setup-python@v5
        if: env.SKIP != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: env.SKIP != 'true'
        run: pip install -r requirements.txt

      - name: Run the scan
        if: env.SKIP != 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/scan_channels.py

      - name: Commit updated data
        if: env.SKIP != 'true'
        run: |
          git config user.name "pt-outlier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/outliers.json data/channels_seen.json
          git diff --staged --quiet || git commit -m "Daily outlier scan: $(date -u +%Y-%m-%d)"
          git push

      - name: Setup Pages
        if: env.SKIP != 'true'
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        if: env.SKIP != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: env.SKIP != 'true'
        uses: actions/deploy-pages@v4

      # TEMP: test email alert once, then remove
      - name: Intentional failure (test alert)
        if: env.SKIP != 'true'
        run: |
          echo "Testing failure email"
          exit 1

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ daily-scan failed in pt-outlier-dashboard"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Job: ${{ github.job }}
            Branch: ${{ github.ref_name }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
