name: Daily rotator cuff outlier scan

on:
  schedule:
    # 2:00 AM America/New_York year-round:
    # EST (UTC-5) => 07:00 UTC, EDT (UTC-4) => 06:00 UTC
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Skip run unless it is 2am Eastern
        run: |
          hour_et=$(TZ="America/New_York" date +%H)
          if [ "$hour_et" != "02" ]; then
            echo "Current hour in America/New_York is $hour_et, not 02. Skipping this trigger."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != 'true'

      - uses: actions/setup-python@v5
        if: env.SKIP != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: env.SKIP != 'true'
        run: pip install -r requirements.txt

      - name: Run the scan
        if: env.SKIP != 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/scan_channels.py

      - name: Commit updated data
        if: env.SKIP != 'true'
        run: |
          git config user.name "pt-outlier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/outliers.json data/channels_seen.json
          git diff --staged --quiet || git commit -m "Daily outlier scan: $(date -u +%Y-%m-%d)"
          git push

      - name: Setup Pages
        if: env.SKIP != 'true'
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        if: env.SKIP != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: env.SKIP != 'true'
        uses: actions/deploy-pages@v4

      - name: Send failure email
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ daily-scan failed in pt-outlier-dashboard"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Job: ${{ github.job }}
            Branch: ${{ github.ref_name }}
            Status: FAILED
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send non-failure email (success or skipped)
        if: always() && !failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ daily-scan completed (success or skipped) in pt-outlier-dashboard"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Job: ${{ github.job }}
            Branch: ${{ github.ref_name }}
            Skip flag: ${{ env.SKIP }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
